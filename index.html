<!-- PURE CSS PLASMA ORBS -->
<style>
.plasma-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; background: #0a001a; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; }
.orb-1 { width: 400px; height: 400px; background: #ff00ff; top: -100px; left: -100px; animation: float1 8s infinite alternate ease-in-out; }
.orb-2 { width: 500px; height: 500px; background: #00ffff; bottom: -150px; right: -50px; animation: float2 10s infinite alternate ease-in-out; }
.orb-3 { width: 300px; height: 300px; background: #ffff00; top: 40%; left: 40%; animation: float3 12s infinite alternate ease-in-out; }
@keyframes float1 { to { transform: translate(200px, 200px) scale(1.2); } }
@keyframes float2 { to { transform: translate(-200px, -150px) scale(1.1); } }
@keyframes float3 { to { transform: translate(-100px, 150px) scale(1.3); } }
</style>
<div class="plasma-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
